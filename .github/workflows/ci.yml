# Pipeline 1 (spec §11.1): runs on every pull request and every push to main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: Build & tests (unit, integration, ArchUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Maven verify
        run: ./mvnw -B -ntp verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore

  e2e:
    name: End-to-end (infra, security, observability)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package services
        run: ./mvnw -B -ntp package -DskipTests
      - name: Generate throw-away dev secrets
        run: bash infra/generate-dev-env.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start infrastructure
        run: |
          docker compose -f infra/docker-compose.yml --env-file infra/.env up -d
          # wait for the healthchecks (kafka-init is a one-shot job, so `up --wait` is not used)
          for i in $(seq 1 60); do
            unhealthy=$(docker compose -f infra/docker-compose.yml --env-file infra/.env ps --format '{{.Service}} {{.Health}}'               | awk '$1!="kafka-init" && $2!="healthy"')
            [ -z "$unhealthy" ] && break
            sleep 5
          done
          docker compose -f infra/docker-compose.yml --env-file infra/.env ps
      - name: Infra smoke test
        run: bash infra/smoke-test.sh
      - name: Security end-to-end
        run: bash infra/e2e-security.sh
      - name: Observability end-to-end
        run: bash infra/e2e-observability.sh
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml --env-file infra/.env logs --tail 200
          tail -n 100 infra/.*.log || true
      - name: Stop infrastructure
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env down -v
