spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USER:payment}
    # no default: the password comes from infra/.env (PAYMENT_DB_PASSWORD)
    password: ${PAYMENT_DB_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8084}

marketchat:
  payment:
    stripe:
      # test-mode keys from infra/.env, never committed; empty = Stripe disabled (503 PAYMENT_PROVIDER_NOT_CONFIGURED)
      secret-key: ${STRIPE_SECRET_KEY:}
      # from `stripe listen` or the Dashboard webhook endpoint; empty = webhook disabled (sync on return still works)
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # Stripe Checkout sessions live 30 minutes (Stripe's minimum), like the order payment timeout
    session-ttl-minutes: 30
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:true}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${MARKETCHAT_ENV:dev}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs
  logging:
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:true}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:true}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
        step: 10s
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      # JSON logs (Elastic Common Schema) with trace.id / span.id; use the Spring profile "plain-logs" for plain text
      console: ecs
