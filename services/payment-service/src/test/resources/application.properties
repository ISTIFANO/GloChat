# Tests: no Kafka broker (outbox rows are asserted instead), a known webhook secret to sign test events.
marketchat.outbox.relay.enabled=false
marketchat.payment.stripe.webhook-secret=whsec_test_marketchat_only_for_tests
marketchat.payment.stripe.secret-key=

# Service URLs have no default in application.yml (production must set them): tests use these placeholders.
# Nothing listens on port 9; Testcontainers overrides the datasource and Kafka connection details.
KEYCLOAK_ISSUER_URI=http://127.0.0.1:9/realms/marketchat
KEYCLOAK_JWK_SET_URI=http://127.0.0.1:9/realms/marketchat/protocol/openid-connect/certs
KEYCLOAK_TOKEN_URI=http://127.0.0.1:9/realms/marketchat/protocol/openid-connect/token
OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:9
OTEL_EXPORT_ENABLED=false
COMMERCE_DB_URL=jdbc:postgresql://127.0.0.1:9/commerce_db
PAYMENT_DB_URL=jdbc:postgresql://127.0.0.1:9/payment_db
KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:9
WEB_BASE_URL=http://web.test
PAYMENT_URL=http://127.0.0.1:9
COMMERCE_URL=http://127.0.0.1:9
AGENT_URL=http://127.0.0.1:9
CORS_ALLOWED_ORIGINS=http://web.test
