spring:
  application:
    name: commerce-service
  datasource:
    url: ${COMMERCE_DB_URL}
    username: ${COMMERCE_DB_USER:commerce}
    # no default: the password comes from infra/.env (COMMERCE_DB_PASSWORD)
    password: ${COMMERCE_DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

---
# Demo data (fictional Rabat merchants): SPRING_PROFILES_ACTIVE=demo
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo

---

server:
  port: ${SERVER_PORT:8081}

marketchat:
  web:
    # where Stripe sends the customer back (the separately deployed web app)
    base-url: ${WEB_BASE_URL}
  payment:
    base-url: ${PAYMENT_URL}
    client-id: commerce-service
    # no default: from infra/.env (COMMERCE_CLIENT_SECRET)
    client-secret: ${COMMERCE_CLIENT_SECRET:}
  security:
    token-uri: ${KEYCLOAK_TOKEN_URI}
    # Tokens' "iss" claim (public URL) and where to fetch signing keys (may differ inside Docker)
    issuer-uri: ${KEYCLOAK_ISSUER_URI}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:true}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${MARKETCHAT_ENV:dev}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs
  logging:
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:true}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:true}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
        step: 10s
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      # JSON logs (Elastic Common Schema) with trace.id / span.id; use the Spring profile "plain-logs" for plain text
      console: ecs
