spring:
  application:
    name: commerce-service

server:
  port: ${SERVER_PORT:8081}

marketchat:
  security:
    # Tokens' "iss" claim (public URL) and where to fetch signing keys (may differ inside Docker)
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/marketchat}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/marketchat/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
