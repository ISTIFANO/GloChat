spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: commerce
              uri: ${COMMERCE_URL}
              predicates:
                - Path=/api/catalog/**,/api/cart/**,/api/checkout/**,/api/orders/**,/api/me/**
            - id: agent
              uri: ${AGENT_URL}
              predicates:
                - Path=/api/chat/**,/api/conversations/**
            - id: payment-webhook
              uri: ${PAYMENT_URL}
              predicates:
                - Path=/api/payments/stripe/webhook

server:
  port: ${SERVER_PORT:8080}

marketchat:
  cors:
    # the separately deployed web app (marketchat-web); add production origins via env
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:true}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${MARKETCHAT_ENV:dev}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs
  logging:
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:true}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:true}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
        step: 10s
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      # JSON logs (Elastic Common Schema) with trace.id / span.id; use the Spring profile "plain-logs" for plain text
      console: ecs
